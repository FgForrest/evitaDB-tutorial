  <p><strong>Tip:</strong> Use semantic HTML to improve accessibility and SEO.</p>
  <ul>
    <li>Prefer <code>&lt;button&gt;</code> over clickable <code>&lt;div&gt;</code>.</li>
    <li>Label inputs with <code>&lt;label for&gt;</code>.</li>
    <li>Group related controls inside <code>&lt;fieldset&gt;</code>.</li>
  </ul>
